name: Deployment Summary & Client Notifications (Centralized Branding)

on:
  push:
    branches:
      - main

jobs:
  deploy-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v3

      - name: Checkout client branding repository
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.CLIENT_BRANDING_REPO }}
          path: client-branding
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc jq tree curl imagemagick mailutils texlive-xetex

      - name: Run deployment summary script
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          chmod +x ./generate-deployment-summary.sh
          ./generate-deployment-summary.sh

      - name: Fetch latest Vercel deployment URL
        id: vercel
        run: |
          export VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL=$(vercel deployments list --prod --token $VERCEL_TOKEN --limit 1 --json | jq -r '.[0].url')
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV

      - name: Generate branded PDFs for clients
        run: |
          IFS=',' read -ra CLIENTS <<< "${{ secrets.CLIENT_EMAILS }}"
          for client in "${CLIENTS[@]}"; do
            # Extract name before @ and sanitize for safe file paths
            NAME=$(echo "$client" | sed 's/@.*//' | tr -cd '[:alnum:]_-')
            
            # Skip if name is empty after sanitization
            if [ -z "$NAME" ]; then
              echo "Warning: Skipping invalid client email: $client"
              continue
            fi
            
            LOGO_PATH="client-branding/logos/$NAME-logo.png"
            NOTES_PATH="client-branding/notes/$NAME-notes.md"
            COLOR_THEME="blue" # Optional, can extend to per-client colors
            
            # Merge notes if available
            if [ -f "$NOTES_PATH" ]; then
              pandoc DEPLOYMENT_SUMMARY.md "$NOTES_PATH" -V client_name="$NAME" -o "DEPLOYMENT_SUMMARY_$NAME.md"
            else
              cp DEPLOYMENT_SUMMARY.md "DEPLOYMENT_SUMMARY_$NAME.md"
            fi

            # Convert to PDF with branding
            # Create temporary header file for logo inclusion with sanitized name
            HEADER_FILE="header-${NAME}.tex"
            if [ -f "$LOGO_PATH" ]; then
              cat > "$HEADER_FILE" << EOF
          \includegraphics[width=3cm]{$LOGO_PATH}
          EOF
              pandoc "DEPLOYMENT_SUMMARY_$NAME.md" \
                -V geometry:margin=1in \
                -V colorlinks=true \
                -V linkcolor="$COLOR_THEME" \
                --pdf-engine=xelatex \
                --include-in-header "$HEADER_FILE" \
                -o "DEPLOYMENT_SUMMARY_$NAME.pdf"
              rm "$HEADER_FILE"
            else
              # Generate PDF without logo if logo file doesn't exist
              pandoc "DEPLOYMENT_SUMMARY_$NAME.md" \
                -V geometry:margin=1in \
                -V colorlinks=true \
                -V linkcolor="$COLOR_THEME" \
                --pdf-engine=xelatex \
                -o "DEPLOYMENT_SUMMARY_$NAME.pdf"
            fi
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-summaries
          path: DEPLOYMENT_SUMMARY_*.pdf

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_TOKEN }}
          text: 'Branded deployment summaries for ${{ github.repository }} are ready. Latest deployment: ${{ env.DEPLOYMENT_URL }}'

      - name: Email Branded PDFs to Clients
        uses: dawidd6/action-send-mail@v3
        if: ${{ secrets.SMTP_SERVER }}
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Deployment Summary - ${{ github.repository }}
          to: ${{ secrets.CLIENT_EMAILS }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Hello,
            
            Your branded deployment summary is attached to this email.
            
            Latest deployment: ${{ env.DEPLOYMENT_URL }}
            
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
          attachments: DEPLOYMENT_SUMMARY_*.pdf
