name: Generate and Update Mermaid Diagram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - 'agents/**'

jobs:
  generate-mermaid:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli

      - name: Verify Mermaid installation
        run: |
          mmdc --version

      - name: Generate Mermaid diagram
        run: |
          echo "Generating Mermaid diagram from architecture..."
          if [ -f "architecture-diagram.mmd" ]; then
            mmdc -i architecture-diagram.mmd -o architecture-diagram.svg
            mmdc -i architecture-diagram.mmd -o architecture-diagram.png
            echo "✅ Diagram generated successfully"
          else
            echo "⚠️ architecture-diagram.mmd not found, skipping diagram generation"
          fi

      - name: Update diagram in repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f "architecture-diagram.svg" ] || [ -f "architecture-diagram.png" ]; then
            [ -f "architecture-diagram.svg" ] && git add architecture-diagram.svg
            [ -f "architecture-diagram.png" ] && git add architecture-diagram.png
            git diff --staged --quiet || git commit -m "Update Mermaid architecture diagrams [skip ci]"
            git push || echo "No changes to push"
          else
            echo "No diagram files to commit"
          fi

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mermaid-diagrams
          path: |
            architecture-diagram.svg
            architecture-diagram.png
          retention-days: 90
